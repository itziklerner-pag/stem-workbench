<!doctype html><meta charset="utf-8"><title>spike fixture player</title>
<body style="margin:0;background:#1b2430;color:#e8eef4;font:14px/1.5 system-ui,sans-serif">
<h2 style="padding:12px 16px;margin:0">local fixture — the page the permanent gate uses</h2>
<pre id="s" style="padding:0 16px;color:#fd8">idle</pre>
<!-- A REAL media element, not an oscillator: the thing under test is a page
     that renders audio the way youtube.com does. Local on purpose — the CI gate
     must never depend on YouTube's DOM or its bot walls (seed §17 item 1).
     tone.wav is 60 s long so no loop wrap can land inside a measurement window;
     `loop` is belt and braces. Generated by spike/bin/make-fixture.sh. -->
<audio id="a" src="tone.wav" loop preload="auto"></audio>
<script>
const a = document.getElementById('a');
const say = () => { document.getElementById('s').textContent =
  `paused=${a.paused} t=${a.currentTime.toFixed(2)} dur=${a.duration} muted=${a.muted} vol=${a.volume}`; };
a.addEventListener('timeupdate', say);
a.addEventListener('playing', say);
// `?silent=1` is the NEGATIVE CONTROL: the page loads and the media element
// exists, but nothing is ever played. Without it, "the captured stream was
// non-silent" is indistinguishable from a capture meter stuck high. The flag
// has to be honoured HERE, in the page: gating it only in main.js left the
// page autoplaying on its own and the control read 0.350295 instead of 0 —
// which is exactly how that control earned its place.
if (new URLSearchParams(location.search).get('silent') === '1') {
  document.getElementById('s').textContent = 'negative control: not playing';
} else {
  // Autoplay: the app runs with --autoplay-policy=no-user-gesture-required, and
  // main.js presses play with a real user gesture if that does not take.
  a.play().then(say, (e) => { document.getElementById('s').textContent = 'play() rejected: ' + e; });
}
</script>
